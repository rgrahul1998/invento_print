<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>KOT and Bill Printer</title>
	<style>
		:root { --ink: #1c2430; --muted: #5b6675; --line: #d9dee5; --ok: #157347; --bad: #b42318; --warn: #a15c00; --bg: #f5f6f8; --card: #fff; }
		* { box-sizing: border-box; }
		body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
		main { max-width: 620px; margin: 0 auto; display: grid; gap: 14px; }
		h1 { margin: 0; font-size: 22px; }
		section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
		h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
		#status { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 650; border-width: 2px; }
		#status small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
		#status[data-state="ok"] { border-color: var(--ok); color: var(--ok); }
		#status[data-state="bad"] { border-color: var(--bad); color: var(--bad); }
		#status[data-state="warn"] { border-color: var(--warn); color: var(--warn); }
		label { display: block; margin-bottom: 12px; font-weight: 600; }
		select { display: block; width: 100%; margin-top: 4px; padding: 10px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
		label.spaced { margin-top: 16px; }
		button { padding: 10px 14px; font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
		button:disabled { opacity: .55; cursor: default; }
		ul { list-style: none; margin: 0; padding: 0; }
		li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
		li:first-child { border-top: 0; }
		li span:last-child { color: var(--muted); white-space: nowrap; }
		#empty, .hint { color: var(--muted); font-size: 14px; margin: 0; }
		.hint { margin-top: 10px; }
	</style>
</head>
<body data-csrf="{{ csrf_token }}" data-now="{{ server_now }}">
	<main>
		<h1>KOT and Bill Printer</h1>
		<section id="status" data-state="warn" role="status" aria-live="polite">
			<div><span id="status-title">Starting</span><small id="status-detail">Connecting to QZ Tray</small></div>
		</section>
		<section>
			<h2>Printers</h2>
			<label>KOT printer
				<select id="kot-printer" disabled><option>Waiting for QZ Tray</option></select>
			</label>
			<button id="test-kot" type="button" disabled>Test KOT printer</button>
			<label class="spaced">Bill printer
				<select id="bill-printer" disabled><option>Waiting for QZ Tray</option></select>
			</label>
			<button id="test-bill" type="button" disabled>Test bill printer</button>
			<label class="spaced">Paper width
				<select id="width">
					<option value="48">80 mm (about 3 inches)</option>
					<option value="32">58 mm (about 2 inches)</option>
				</select>
			</label>
			<p class="hint">Keep this page open while the restaurant is taking orders. It prints new KOTs and bills automatically.</p>
		</section>
		<section>
			<h2>Printed since this page opened</h2>
			<p id="empty">Nothing yet</p>
			<ul id="history"></ul>
		</section>
	</main>
	<script src="/assets/invento_print/js/qz-tray.js"></script>
	<script src="/assets/invento_print/js/kot_printer.js"></script>
</body>
</html>
